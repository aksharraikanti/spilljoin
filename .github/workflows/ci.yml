name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    name: "SpillJoin offline suite"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require discoverable tests
        run: /usr/bin/python3 -B -c 'import sys, unittest; sys.exit(unittest.defaultTestLoader.discover("tests").countTestCases() == 0)'
      - name: Run the offline suite
        run: /usr/bin/python3 -B -m unittest discover -s tests -v
